<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" fill="none" role="img" aria-label="Signet">
  <title>Signet</title>
  <!-- Signet Folded Ribbon S - From Brand Identity Board -->
  <!-- Upper loop: upright facet -->
  <polygon points="8,23 8,10 19,4 19,17" fill="currentColor"/>
  <!-- Upper loop: shaded fold facet -->
  <polygon points="19,4 28,10 28,21 19,17" fill="currentColor" fill-opacity="0.6"/>
  <!-- Lower loop: upright facet -->
  <polygon points="28,21 28,34 17,40 17,27" fill="currentColor"/>
  <!-- Lower loop: shaded fold facet -->
  <polygon points="17,40 8,34 8,23 17,27" fill="currentColor" fill-opacity="0.6"/>
</svg>